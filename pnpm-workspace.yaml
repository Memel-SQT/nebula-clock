packages:
  - 'apps/*'
  - 'packages/*'

# Which dependencies are allowed to run their install scripts. electron
# downloads its binary and esbuild unpacks a native executable, so both are
# required; core-js only prints a funding notice.
#
# pnpm 11.7 does not actually honour these lists for transitive dependencies,
# so CI additionally passes --config.dangerouslyAllowAllBuilds=true. That is
# safe there because the lockfile is frozen and fully pinned.
onlyBuiltDependencies:
  - electron
  - esbuild

ignoredBuiltDependencies:
  - core-js
