packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  core-js: set this to true or false
  electron: set this to true or false
  esbuild: set this to true or false

# These need their postinstall to run: electron downloads its binary,
# esbuild unpacks the platform-native executable.
onlyBuiltDependencies:
  - electron
  - esbuild
