packages:
  - 'apps/*'
  - 'packages/*'

# pnpm requires every package with a build script to be classified, and
# treats anything left unclassified as an error in CI.
onlyBuiltDependencies:
  # Downloads its own binary.
  - electron
  # Unpacks the platform-native executable.
  - esbuild

ignoredBuiltDependencies:
  # Its postinstall only prints a funding message.
  - core-js
