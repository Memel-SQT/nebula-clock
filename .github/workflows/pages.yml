name: Deploy PWA to GitHub Pages

# Deliberately keyed off the Release workflow rather than `on: release`.
# GitHub does not start workflows for events raised with GITHUB_TOKEN, and
# semantic-release publishes the release with exactly that token, so an
# `on: release` trigger would never once fire.
on:
  workflow_run:
    workflows: ['Release']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race; skip queued runs rather than cancelling a
# deployment that is already live-swapping.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy
    # Only after a Release run that actually succeeded; a manual dispatch has
    # no triggering run to inspect.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile --config.dangerouslyAllowAllBuilds=true

      - name: Build
        # Pages serves the app from /<repo>/, which the service worker scope
        # and the PWA manifest both have to agree on.
        run: pnpm build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - id: deployment
        uses: actions/deploy-pages@v4
