<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Nebula Clock</title>
    <meta
      name="description"
      content="A privacy-first Pomodoro time manager. Everything stays on your device."
    />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="nebula-clock-mark.svg" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="theme-color" content="#0A0A0F" />
    <meta name="color-scheme" content="dark light" />

    <!-- Inter is self-hosted: the app makes no third-party request at all,
         and its typography survives being offline. Deliberately not
         preloaded - a font fetch is made in CORS mode, which does not match
         a same-origin preload hint under file://, so Electron discarded it
         and warned on every launch. -->
    <link rel="stylesheet" href="fonts.css" />

    <script>
      /**
       * Paint the right theme, accent, motion level and text size before the
       * first frame (no flash). Mirrors src/hooks/useAppearance.ts; kept inline
       * and dependency-free because it runs before the bundle. Reads the 1.2
       * shape too (light / dark, reduceMotion) until the store migrates it.
       */
      (function () {
        var root = document.documentElement;
        try {
          var raw = localStorage.getItem('nebula-clock-settings');
          var a = (raw && JSON.parse(raw).state.settings.appearance) || {};
          var legacy = { light: 'nebula-light', dark: 'nebula-dark' };
          var themes = ['nebula-dark', 'nebula-light', 'glass-dark', 'glass-light'];
          var mode = legacy[a.theme] || a.theme;
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var resolved =
            themes.indexOf(mode) >= 0 ? mode : prefersDark ? 'nebula-dark' : 'nebula-light';
          root.setAttribute('data-theme', resolved);
          var motion = a.motion || (a.reduceMotion ? 'reduced' : 'full');
          if (['full', 'reduced', 'off'].indexOf(motion) >= 0)
            root.setAttribute('data-motion', motion);
          if (typeof a.background === 'string') root.setAttribute('data-background', a.background);
          if (a.highContrast === true) root.setAttribute('data-contrast', 'high');
          if (typeof a.fontScale === 'number')
            root.style.setProperty('--font-scale', String(a.fontScale));
          if (window.nebula) root.setAttribute('data-desktop', 'true');
          var paint = JSON.parse(localStorage.getItem('nebula-clock-paint') || 'null');
          if (paint && paint.theme === resolved && paint.variables) {
            for (var name in paint.variables) {
              if (/^--[a-z0-9-]+$/.test(name))
                root.style.setProperty(name, String(paint.variables[name]));
            }
          }
        } catch (error) {
          root.setAttribute('data-theme', 'nebula-dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
