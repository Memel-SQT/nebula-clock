<svg
  viewBox="0 0 372 100"
  width="372"
  height="100"
  xmlns="http://www.w3.org/2000/svg"
  role="img"
  aria-label="Nebula Clock"
>
  <title>Nebula Clock</title>
  <defs>
    <linearGradient id="nebulaClockLockup" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C6EF5" />
      <stop offset="1" stop-color="#A855F7" />
    </linearGradient>
  </defs>

  <rect width="100" height="100" rx="24" fill="#1A1A2E" />
  <circle cx="50" cy="50" r="32" fill="none" stroke="url(#nebulaClockLockup)" stroke-width="8" />
  <path
    d="M50 50V32.5M50 50l10.83 6.25"
    stroke="url(#nebulaClockLockup)"
    stroke-width="7.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!--
    The wordmark is live text set in Inter Bold, so it stays selectable and
    recolours with `currentColor`. Convert it to outlines before handing the
    file to anyone who will not have the font.
  -->
  <text
    x="132"
    y="64"
    fill="currentColor"
    font-family="Inter, -apple-system, 'Segoe UI', system-ui, sans-serif"
    font-size="38"
    font-weight="700"
    letter-spacing="-0.8"
  >
    Nebula Clock
  </text>
</svg>
